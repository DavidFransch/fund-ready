# Build → migrate → deploy. One trigger per branch:
#   develop → _ENV=dev     main → _ENV=prod
# Created by infra/setup-gcp.sh.

substitutions:
  _ENV: dev
  _REGION: africa-south1
  _AR_REPO: app
  _SQL_INSTANCE: books-db
  _MIN_INSTANCES: "0"

options:
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/next-server-actions-key/versions/latest
      env: NEXT_SERVER_ACTIONS_ENCRYPTION_KEY

steps:
  - id: build-app
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    secretEnv: [NEXT_SERVER_ACTIONS_ENCRYPTION_KEY]
    args:
      - -c
      - >-
        docker build --target runner
        --build-arg NEXT_SERVER_ACTIONS_ENCRYPTION_KEY=$$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        --build-arg DEPLOYMENT_VERSION=$SHORT_SHA
        -t ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:$SHORT_SHA .

  - id: build-migrate
    name: gcr.io/cloud-builders/docker
    args: [build, --target, migrate, -t, "${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/migrate:$SHORT_SHA", .]

  - id: push
    name: gcr.io/cloud-builders/docker
    entrypoint: bash
    args:
      - -c
      - >-
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:$SHORT_SHA &&
        docker push ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/migrate:$SHORT_SHA

  - id: migrate
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - migrate-${_ENV}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/migrate:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=run-${_ENV}@$PROJECT_ID.iam.gserviceaccount.com
      - --set-cloudsql-instances=$PROJECT_ID:${_REGION}:${_SQL_INSTANCE}
      - --set-secrets=DATABASE_URL=database-url-${_ENV}:latest
      - --max-retries=0
      - --execute-now
      - --wait

  - id: deploy
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - app-${_ENV}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=run-${_ENV}@$PROJECT_ID.iam.gserviceaccount.com
      - --add-cloudsql-instances=$PROJECT_ID:${_REGION}:${_SQL_INSTANCE}
      - --set-secrets=DATABASE_URL=database-url-${_ENV}:latest,BETTER_AUTH_SECRET=better-auth-secret-${_ENV}:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest
      # Cloud Run's default URL. Change BETTER_AUTH_URL when a custom domain is added.
      - --update-env-vars=APP_ENV=${_ENV},STORAGE_BUCKET=$PROJECT_ID-files-${_ENV},BETTER_AUTH_URL=https://app-${_ENV}-$PROJECT_NUMBER.${_REGION}.run.app
      - --min-instances=${_MIN_INSTANCES}
      - --max-instances=4
      - --memory=512Mi
      - --cpu=1
      - --allow-unauthenticated

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/web:$SHORT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPO}/migrate:$SHORT_SHA
